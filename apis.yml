aid: tempus-ex
name: Tempus Ex
description: >-
  Tempus Ex is a sports data and media technology company (part of Infinite
  Athlete) whose FusionFeed API aggregates data and media from many on-site
  sources into a single API for gridiron football (NFL and NCAA) and association
  football (soccer). FusionFeed provides schedules, game-by-game rosters,
  official and AI-automated statistics, low-latency X/Y telemetry for players,
  officials and the ball, scoreboard data, and live/VOD video (HLS and
  sub-second SRT) including computer-vision products such as bounding boxes,
  skeletal pose estimation, camera calibration and virtual FusionCams. The API
  is offered as a GraphQL-first interface (with WebSocket subscriptions via
  graphql-ws) and an interchangeable REST interface, both versioned under /v2/,
  with a Fusion Query Language (FQL) for powerful play/event search.
